<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <filter id="iconBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      /* 1. Появление основы иконки (Буква С) */
      @keyframes iconIntro {
        0% { transform: scale(0); opacity: 0; }
        55% { transform: scale(1.08); opacity: 1; }
        70% { transform: scale(0.96); }
        85%, 100% { transform: scale(1); opacity: 1; }
      }
      
      /* 2. Эффектный взрыв/вспышка звезды */
      @keyframes starFlash {
        0%, 45% { transform: scale(0); opacity: 0; filter: brightness(1.5); }
        65% { transform: scale(1.25); opacity: 1; filter: brightness(1.3); }
        80%, 100% { transform: scale(1); opacity: 1; filter: brightness(1); }
      }
      
      /* 3. Плавное появление текста снизу */
      @keyframes textReveal {
        0%, 60% { opacity: 0; transform: translateY(15px); }
        85%, 100% { opacity: 1; transform: translateY(0); }
      }
      
      /* 4. Постоянное фоновое «дыхание» света после открытия */
      @keyframes lightBreathe {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.30; transform: scale(1.06); }
      }

      .anim-base {
        animation: iconIntro 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        transform-origin: 256px 210px;
      }
      .anim-star {
        animation: starFlash 1.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transform-origin: 256px 210px;
      }
      .anim-text {
        animation: textReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .anim-glow {
        animation: lightBreathe 3.5s ease-in-out infinite;
        animation-delay: 1.6s;
        transform-origin: 256px 210px;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="100" fill="#FFFFFF" />

  <g class="anim-base">
    <circle class="anim-glow" cx="256" cy="210" r="75" fill="#F59E0B" opacity="0.15" filter="url(#iconBlur)" />
    <path d="M 256 94 A 116 116 0 1 0 256 326" fill="none" stroke="#09090B" stroke-width="15" stroke-linecap="round" />
  </g>

  <path class="anim-star" d="M 256 144 Q 256 210 190 210 Q 256 210 256 276 Q 256 210 322 210 Q 256 210 256 144 Z" fill="url(#iconGlow)" />

  <g class="anim-text">
    <text x="256" y="405" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" text-anchor="middle">
      <tspan font-weight="900" fill="#09090B" letter-spacing="4">СВЕТ</tspan>
      <tspan font-weight="300" fill="#71717A" letter-spacing="1">.ру</tspan>
    </text>
  </g>
</svg>
